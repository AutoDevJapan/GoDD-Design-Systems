name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-build:
    name: Pages 静的ビルド (配備なし)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ビルド入力の変更を確認
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- app src pages lib public scripts package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc ':(glob)*.js' ':(glob)*.mjs' ':(glob)*.cjs' ':(glob)*.ts' ':(glob)*.tsx' ':(glob)*.jsx' ':(glob)*.json' ':(glob)*.jsonc' taxonomy.md .github/workflows/ci.yml .github/workflows/deploy-pages.yml)
          if [ -n "$changed" ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.build == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.build == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - name: 依存インストール
        if: steps.scope.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - name: カタログ全件のトレースを除外
        if: steps.scope.outputs.build == 'true'
        run: rm -rf -- design-md
      - name: Pages 向けビルドと出力確認
        if: steps.scope.outputs.build == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm run build:pages
          test -s out/index.html
          test -s out/en/index.html

  schema:
    name: schema 検証 (index.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: 依存インストール
        run: pnpm install --frozen-lockfile
      - name: 型検査
        run: pnpm exec tsc --noEmit
      - name: index.json をスキーマ検証
        run: pnpm run validate:index
      - name: index-summary.json をスキーマ + index 整合検証
        run: pnpm run validate:index-summary
      - name: DESIGN.md をスキーマ + 構造検証
        run: pnpm run validate:design-md
      - name: jsic.json をスキーマ + 整合性 + index 相互検証
        run: pnpm run validate:jsic
      - name: taxonomy.json をスキーマ + index 相互検証 (color/mood 全カバー)
        run: pnpm run validate:taxonomy
      - name: 法務チェック (de-brand / オープン書体 / 出典表示 · SSOT §8)
        run: pnpm run legal:check
      - name: a11y 不変条件チェック (skip-link / landmark / focus / contrast · #23)
        run: pnpm run a11y:check

  secrets-scan:
    name: gitleaks (機密検出)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks インストール
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: 機密スキャン (作業ツリー)
        run: gitleaks detect --no-git --redact -v
